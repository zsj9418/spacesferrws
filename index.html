<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONE WORLD · 同一世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* 导航栏 */
        nav {
            position: fixed;
            width: 100%;
            padding: 20px 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        nav ul li a:hover {
            transform: translateY(-2px);
        }

        nav ul li a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: white;
            transition: width 0.3s ease;
        }

        nav ul li a:hover::after {
            width: 100%;
        }

        /* 主英雄区 */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            color: white;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: bold;
            margin-bottom: 20px;
            animation: fadeInUp 1s ease;
            background: linear-gradient(45deg, #fff, #ffd89b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            margin-bottom: 40px;
            animation: fadeInUp 1.2s ease;
            opacity: 0.9;
        }

        .peace-symbol {
            width: 200px;
            height: 200px;
            margin: 40px auto;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 按钮样式 */
        .cta-button {
            display: inline-block;
            padding: 15px 40px;
            background: white;
            color: #764ba2;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.3s ease;
            animation: fadeInUp 1.4s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        /* 特色部分 */
        .features {
            padding: 100px 50px;
            background: white;
        }

        .features-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        .feature-card {
            text-align: center;
            padding: 40px;
            border-radius: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            transition: transform 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-10px);
        }

        .feature-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .feature-card h3 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #333;
        }

        .feature-card p {
            color: #666;
            line-height: 1.6;
        }

        /* 引言部分 */
        .quote {
            padding: 100px 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            text-align: center;
        }

        .quote-text {
            max-width: 800px;
            margin: 0 auto;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-style: italic;
            margin-bottom: 30px;
        }

        .quote-author {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        /* 图片画廊 */
        .gallery {
            padding: 100px 50px;
            background: white;
        }

        .gallery h2 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 50px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .gallery-item {
            height: 250px;
            border-radius: 15px;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: scale(1.05);
        }

        .gallery-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.5));
        }

        /* 页脚 */
        footer {
            padding: 50px;
            background: #222;
            color: white;
            text-align: center;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }

        .social-links a {
            color: white;
            font-size: 24px;
            transition: transform 0.3s ease;
        }

        .social-links a:hover {
            transform: translateY(-5px);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            nav ul {
                gap: 20px;
            }
            
            nav ul li a {
                font-size: 14px;
            }
            
            .features {
                padding: 50px 20px;
            }
        }

        /* 浮动元素 */
        .floating-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .floating-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-50px) rotate(180deg); }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav>
        <ul>
            <li><a href="#home">首页</a></li>
            <li><a href="#unity">团结</a></li>
            <li><a href="#peace">和平</a></li>
            <li><a href="#love">关爱</a></li>
            <li><a href="#future">未来</a></li>
        </ul>
    </nav>

    <!-- 主英雄区 -->
    <section class="hero" id="home">
        <div class="floating-elements">
            <div class="floating-circle" style="width: 100px; height: 100px; top: 10%; left: 10%; animation-delay: 0s;"></div>
            <div class="floating-circle" style="width: 150px; height: 150px; top: 60%; right: 10%; animation-delay: 2s;"></div>
            <div class="floating-circle" style="width: 80px; height: 80px; bottom: 20%; left: 30%; animation-delay: 4s;"></div>
        </div>
        
        <h1>ONE WORLD</h1>
        <p>让和平之光照亮世界的每一个角落</p>
        
        <!-- 和平符号 SVG -->
        <svg class="peace-symbol" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="95" fill="none" stroke="white" stroke-width="8"/>
            <line x1="100" y1="10" x2="100" y2="190" stroke="white" stroke-width="8"/>
            <line x1="100" y1="100" x2="50" y2="160" stroke="white" stroke-width="8"/>
            <line x1="100" y1="100" x2="150" y2="160" stroke="white" stroke-width="8"/>
        </svg>
        
        <a href="#unity" class="cta-button">探索和平之路</a>
    </section>

    <!-- 特色部分 -->
    <section class="features" id="unity">
        <div class="features-container">
            <div class="feature-card">
                <div class="feature-icon">🕊️</div>
                <h3>和平共处</h3>
                <p>不分种族、不分国界，我们都是地球村的一员，携手共建和谐世界。</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🌍</div>
                <h3>全球团结</h3>
                <p>团结一心，共同应对全球挑战，创造更美好的明天。</p>
            </div>
            <div class="feature-card">
                <div class="feature-icon">❤️</div>
                <h3>爱与理解</h3>
                <p>用爱化解仇恨，用理解消除偏见，让世界充满温暖。</p>
            </div>
        </div>
    </section>

    <!-- 引言部分 -->
    <section class="quote" id="peace">
        <div class="quote-text">
            "和平不是没有冲突，而是用和平的方式解决冲突。"
        </div>
        <div class="quote-author">
            — 让我们共同努力
        </div>
    </section>

    <!-- 图片画廊 -->
    <section class="gallery" id="love">
        <h2>和平瞬间</h2>
        <div class="gallery-grid">
            <div class="gallery-item" style="background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);"></div>
            <div class="gallery-item" style="background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);"></div>
            <div class="gallery-item" style="background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%);"></div>
            <div class="gallery-item" style="background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);"></div>
            <div class="gallery-item" style="background: linear-gradient(135deg, #fddb92 0%, #d1fdff 100%);"></div>
            <div class="gallery-item" style="background: linear-gradient(135deg, #9890e3 0%, #b1f4cf 100%);"></div>
        </div>
    </section>

    <!-- 页脚 -->
    <footer id="future">
        <h3>与世界连接</h3>
        <p>© 2024 ONE WORLD · 让和平永驻人间</p>
        <div class="social-links">
            <a href="#">📧</a>
            <a href="#">💬</a>
            <a href="#">🌐</a>
            <a href="#">💝</a>
        </div>
    </footer>

    <script>
        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // 导航栏滚动效果
        window.addEventListener('scroll', function() {
            const nav = document.querySelector('nav');
            if (window.scrollY > 100) {
                nav.style.background = 'rgba(0, 0, 0, 0.9)';
            } else {
                nav.style.background = 'rgba(255, 255, 255, 0.1)';
            }
        });

        // 添加滚动动画
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -100px 0px'
        };

        const observer = new IntersectionObserver(function(entries) {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.animation = 'fadeInUp 1s ease forwards';
                }
            });
        }, observerOptions);

        document.querySelectorAll('.feature-card, .gallery-item').forEach(el => {
            observer.observe(el);
        });
    </script>
</body>
</html>
